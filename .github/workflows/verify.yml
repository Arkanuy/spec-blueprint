name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  documents:
    name: Verify template documents and copy script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------------ #
      - name: Required structure exists
        run: |
          set -e
          for f in README.md CONTRIBUTING.md LICENSE \
                   scripts/new_project.py AGENT-RULES.md \
                   docs/README.md docs/00-problem.md docs/01-requirements.md \
                   docs/02-design.md docs/03-process.md docs/04-data.md \
                   docs/05-ui.md docs/06-testing.md docs/07-build-order.md \
                   docs/08-risks.md; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required files present."

      # ------------------------------------------------------------------ #
      - name: Script syntax
        run: python -m py_compile scripts/new_project.py && echo "syntax ok"

      # ------------------------------------------------------------------ #
      - name: Documents must be EMPTY — no filled-in examples
        run: |
          set -e
          # No leftovers from earlier versions.
          for pattern in 'EXAMPLE-START' 'Toko Berkah' 'kasir-berkah'; do
            if grep -rn "$pattern" docs/; then
              echo "FAIL: found '$pattern' — documents must stay empty and ready to fill"
              exit 1
            fi
          done
          # No table row may already carry a real ID (FR-001, US-001, ...).
          if grep -rnE '^\| *[A-Z]{2,3}-[0-9]{3}' docs/; then
            echo "FAIL: a table row already contains a sample ID"
            exit 1
          fi
          echo "Documents empty: no filled-in examples."

      # ------------------------------------------------------------------ #
      - name: Documents must be English, not Indonesian
        run: |
          set -e
          if grep -rniE '\b(adalah|dengan|untuk|tidak|yang|harus|masalah|kebutuhan|risiko|catatan|pengguna|berkas|apakah|jumlah|kalau|sudah|belum)\b' docs/ AGENT-RULES.md; then
            echo "FAIL: Indonesian text found — this repo ships in English"
            exit 1
          fi
          echo "Documents are English."

      # ------------------------------------------------------------------ #
      - name: Root must not contain AGENTS.md
        run: |
          set -e
          for f in AGENTS.md templates/AGENTS.md docs/AGENTS.md; do
            if [ -f "$f" ]; then
              echo "FAIL: $f must not exist — agents would read it as the contract for this repo."
              echo "Use AGENT-RULES.md at the repo root instead."
              exit 1
            fi
          done
          echo "No AGENTS.md inside the kit."

      # ------------------------------------------------------------------ #
      - name: This repo ships documents only
        run: |
          set -e
          for d in examples templates/code src app tests; do
            if [ -d "$d" ]; then
              echo "FAIL: $d must not exist — this repo contains documents only"
              exit 1
            fi
          done
          echo "Repo contains documents only."

      # ------------------------------------------------------------------ #
      - name: Every document has a title and a purpose line
        run: |
          set -e
          for f in docs/0*.md; do
            head -1 "$f" | grep -q '^# ' || { echo "FAIL: $f has no H1 title"; exit 1; }
            grep -q '^> ' "$f" || { echo "FAIL: $f has no purpose line (blockquote)"; exit 1; }
            grep -q '^---$' "$f" || { echo "FAIL: $f has no horizontal rule"; exit 1; }
          done
          echo "All documents structured."

      # ------------------------------------------------------------------ #
      - name: No {{...}} placeholders
        run: |
          set -e
          if grep -rn '{{[A-Za-z_]*}}' docs/ AGENT-RULES.md; then
            echo "FAIL: no {{...}} placeholders allowed — write the empty label directly"
            exit 1
          fi
          echo "No placeholders."

      # ------------------------------------------------------------------ #
      - name: Internal links point at files that exist
        run: |
          set -e
          for name in $(grep -rhoE '\]\(0[0-9][a-z-]*\.md\)' docs/ | tr -d '](' | sed 's/)//' | sort -u); do
            test -f "docs/$name" || { echo "FAIL: docs/$name is linked but does not exist"; exit 1; }
          done
          echo "All internal links resolve."

      # ------------------------------------------------------------------ #
      - name: Dry run
        run: |
          python scripts/new_project.py --dry-run --target ./out/dryrun | tail -5

      # ------------------------------------------------------------------ #
      - name: Real copy then verify the result
        run: |
          set -e
          python scripts/new_project.py --target ./out/project-a

          echo "--- produced files ---"
          test -f ./out/project-a/docs/00-problem.md
          test -f ./out/project-a/docs/08-risks.md
          test -f ./out/project-a/AGENTS.md
          test -d ./out/project-a/scripts && { echo "FAIL: scripts/ must not be copied"; exit 1; }

          count=$(ls ./out/project-a/docs/*.md | wc -l)
          echo "documents copied: $count"
          [ "$count" -eq 10 ] || { echo "FAIL: expected 10 files (9 documents + README)"; exit 1; }

          echo "--- the result must still be empty ---"
          if grep -rnE '^\| *[A-Z]{2,3}-[0-9]{3}' ./out/project-a/docs; then
            echo "FAIL: the copy contains sample IDs"; exit 1
          fi
          echo "Copy is clean and ready to fill in."

      # ------------------------------------------------------------------ #
      - name: Non-empty target must be rejected
        run: |
          set +e
          python scripts/new_project.py --target ./out/project-a
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "FAIL: a non-empty folder should have been rejected"; exit 1
          fi
          echo "Correct: non-empty folder rejected with code $code"

      # ------------------------------------------------------------------ #
      - name: --target is required
        run: |
          set +e
          python scripts/new_project.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "FAIL: running without --target should fail"; exit 1
          fi
          echo "Correct: missing --target rejected with code $code"
