name: verifikasi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dokumen:
    name: Uji dokumen template dan penyalinan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------------ #
      - name: Struktur wajib ada
        run: |
          set -e
          for f in README.md CONTRIBUTING.md LICENSE \
                   scripts/new_project.py templates/ATURAN-AGEN.md \
                   docs/README.md docs/00-masalah.md docs/01-kebutuhan.md \
                   docs/02-desain.md docs/03-proses.md docs/04-data.md \
                   docs/05-tampilan.md docs/06-uji.md docs/07-urutan-kerja.md \
                   docs/08-risiko.md; do
            test -f "$f" || { echo "HILANG: $f"; exit 1; }
          done
          echo "Semua berkas wajib ada."

      # ------------------------------------------------------------------ #
      - name: Syntax script
        run: python -m py_compile scripts/new_project.py && echo "syntax ok"

      # ------------------------------------------------------------------ #
      - name: Dokumen harus KOSONG — nol contoh terisi
        run: |
          set -e
          # Tidak boleh ada sisa contoh terisi di dokumen yang disalin ke proyek pengguna.
          for pola in 'EXAMPLE-START' 'Toko Berkah' 'kasir-berkah'; do
            if grep -rn "$pola" docs/; then
              echo "GAGAL: ditemukan '$pola' — dokumen harus kosong dan siap diisi"
              exit 1
            fi
          done
          # Tidak boleh ada baris tabel yang sudah terisi ID nyata (FR-001, US-001, dst).
          if grep -rnE '^\| *[A-Z]{2,3}-[0-9]{3}' docs/; then
            echo "GAGAL: ada baris tabel yang sudah berisi ID contoh"
            exit 1
          fi
          echo "Dokumen kosong: tidak ada contoh terisi."

      # ------------------------------------------------------------------ #
      - name: templates/ hanya berisi kontrak agen, bukan AGENTS.md
        run: |
          set -e
          if [ -f templates/AGENTS.md ]; then
            echo "GAGAL: templates/AGENTS.md tidak boleh ada — agen akan membacanya sebagai"
            echo "kontrak untuk repo kit ini sendiri. Pakai templates/ATURAN-AGEN.md."
            exit 1
          fi
          jumlah=$(ls templates/ | wc -l)
          [ "$jumlah" -eq 1 ] || { echo "GAGAL: templates/ harus berisi tepat 1 berkas"; exit 1; }
          echo "templates/ berisi hanya kontrak agen."

      # ------------------------------------------------------------------ #
      - name: Tidak boleh ada proyek contoh di repo
        run: |
          set -e
          if [ -d examples ]; then
            echo "GAGAL: folder examples/ tidak boleh ada di repo ini"
            exit 1
          fi
          if [ -d templates/code ]; then
            echo "GAGAL: repo ini hanya berisi dokumen, tidak memuat kode"
            exit 1
          fi
          echo "Repo hanya berisi dokumen."

      # ------------------------------------------------------------------ #
      - name: Setiap dokumen punya judul dan keterangan tujuan
        run: |
          set -e
          for f in docs/0*.md; do
            head -1 "$f" | grep -q '^# ' || { echo "GAGAL: $f tidak diawali judul H1"; exit 1; }
            grep -q '^> ' "$f" || { echo "GAGAL: $f tidak punya keterangan tujuan (blok >)"; exit 1; }
            grep -q '^---$' "$f" || { echo "GAGAL: $f tidak punya garis pemisah"; exit 1; }
          done
          echo "Semua dokumen terstruktur."

      # ------------------------------------------------------------------ #
      - name: Tidak ada placeholder {{...}}
        run: |
          set -e
          if grep -rn '{{[A-Za-z_]*}}' docs/ templates/; then
            echo "GAGAL: placeholder {{...}} tidak boleh ada, tulis label kosong langsung"
            exit 1
          fi
          echo "Tidak ada placeholder."

      # ------------------------------------------------------------------ #
      - name: Dry-run penyalinan
        run: |
          python scripts/new_project.py --dry-run --target ./out/dryrun | tail -5

      # ------------------------------------------------------------------ #
      - name: Salin nyata lalu verifikasi hasilnya
        run: |
          set -e
          python scripts/new_project.py --target ./out/proyek-uji

          echo "--- berkas hasil ---"
          test -f ./out/proyek-uji/docs/00-masalah.md
          test -f ./out/proyek-uji/docs/08-risiko.md
          test -f ./out/proyek-uji/AGENTS.md
          test -d ./out/proyek-uji/templates && { echo "GAGAL: templates/ tidak boleh ikut"; exit 1; }

          jumlah=$(ls ./out/proyek-uji/docs/*.md | wc -l)
          echo "jumlah dokumen tersalin: $jumlah"
          [ "$jumlah" -eq 10 ] || { echo "GAGAL: harusnya 10 berkas (9 dokumen + README)"; exit 1; }

          echo "--- hasil harus tetap kosong (siap diisi) ---"
          if grep -rnE '^\| *[A-Z]{2,3}-[0-9]{3}' ./out/proyek-uji/docs; then
            echo "GAGAL: hasil salinan berisi ID contoh"; exit 1
          fi
          echo "Hasil salinan bersih dan siap diisi."

      # ------------------------------------------------------------------ #
      - name: Target tidak kosong harus ditolak
        run: |
          set +e
          python scripts/new_project.py --target ./out/proyek-uji
          kode=$?
          set -e
          if [ "$kode" -eq 0 ]; then
            echo "GAGAL: seharusnya menolak folder yang sudah berisi"; exit 1
          fi
          echo "Benar: folder tidak kosong ditolak dengan kode $kode"

      # ------------------------------------------------------------------ #
      - name: --target wajib
        run: |
          set +e
          python scripts/new_project.py
          kode=$?
          set -e
          if [ "$kode" -eq 0 ]; then
            echo "GAGAL: seharusnya menolak tanpa --target"; exit 1
          fi
          echo "Benar: tanpa --target ditolak dengan kode $kode"
